[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://fire-drill-api.onrender.com"

# Proxy API requests directly to live Render backend
[[redirects]]
  from = "/api/*"
  to = "https://fire-drill-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
